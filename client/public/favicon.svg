<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e78d8" />
      <stop offset="100%" stop-color="#0c4a9a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3cb4ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1060c0" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="gleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main Rounded Icon Frame -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="20" />
  
  <!-- Inner Gleam Highlight -->
  <rect x="52" y="52" width="408" height="180" rx="80" fill="url(#gleam)" />

  <!-- Play Symbol ▶ -->
  <polygon points="210,160 350,256 210,352" fill="#ffffff" />
</svg>